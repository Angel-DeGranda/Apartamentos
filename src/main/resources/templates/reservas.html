<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apartamentos | Reservas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root { --navy: #1a252f; --teal: #0d9488; --bg: #f8fafc; }
        body { background: var(--bg); color: #334155; font-family: system-ui, -apple-system, sans-serif; }
        .navbar { background: var(--navy); }
        .panel { background: #fff; border: 1px solid #e2e8f0; border-radius: 8px; }
        .table thead th { background: var(--navy); color: #fff; }
        .btn-primary { background: var(--teal); border-color: var(--teal); }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark mb-4">
        <div class="container">
            <a class="navbar-brand fw-bold" th:href="@{/vista/clientes}">APARTAMENTOS</a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link text-white-50" th:href="@{/vista/clientes}">Clientes</a>
                <a class="nav-link text-white-50" th:href="@{/vista/propiedades}">Propiedades</a>
                <a class="nav-link text-white-50" th:href="@{/vista/disponibilidades}">Disponibilidad</a>
                <a class="nav-link active" th:href="@{/vista/reservas}">Reservas</a>
                <a class="nav-link text-white-50" th:href="@{/vista/pagos}">Pagos</a>
                <a class="nav-link text-white-50" th:href="@{/vista/reportes}">Reportes</a>
            </div>
        </div>
    </nav>

    <main class="container pb-5">
        <header class="d-flex justify-content-between align-items-center mb-4 border-bottom pb-3">
            <div>
                <p class="text-uppercase small mb-0 text-muted">Gestión de Alquileres</p>
                <h1 class="h3 mb-0">Reservas</h1>
            </div>
            <span class="badge bg-secondary fs-6" th:text="${#lists.size(reservas)} + ' registradas'">0 registradas</span>
        </header>

        <div th:if="${mensaje}" class="alert alert-success alert-dismissible fade show"><span th:text="${mensaje}"></span><button type="button" class="btn-close" data-bs-dismiss="alert"></button></div>
        <div th:if="${error}" class="alert alert-danger alert-dismissible fade show"><span th:text="${error}"></span><button type="button" class="btn-close" data-bs-dismiss="alert"></button></div>

        <div class="row g-4">
            <!-- Formulario para crear Reserva -->
            <section class="col-lg-4">
                <div class="panel p-4">
                    <h2 class="h5 mb-3">Crear Reserva</h2>
                    <form th:action="@{/vista/reservas/guardar}" th:object="${reserva}" method="post">
                        <div class="mb-3">
                            <label class="form-label">Arrendatario</label>
                            <select class="form-select" th:field="*{arrendatario.id}" required>
                                <option value="" disabled selected>Seleccione cliente...</option>
                                <option th:each="a : ${arrendatarios}" th:value="${a.id}" th:text="${a.nombres + ' ' + a.apellidos}"></option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Propiedad</label>
                            <select class="form-select" th:field="*{propiedad.idPropiedad}" required>
                                <option value="" disabled selected>Seleccione inmueble...</option>
                                <option th:each="p : ${propiedades}" th:value="${p.idPropiedad}" th:text="${p.titulo + ' ($' + p.precioNoche + '/noche)'}"></option>
                            </select>
                        </div>
                        <div class="mb-3"><label class="form-label">Fecha Entrada</label><input type="date" class="form-control" th:field="*{fechaInicio}" required></div>
                        <div class="mb-3"><label class="form-label">Fecha Salida</label><input type="date" class="form-control" th:field="*{fechaFin}" required></div>
                        <div class="mb-3"><label class="form-label">Precio Total ($)</label><input type="number" step="0.01" class="form-control" th:field="*{precioTotal}" required></div>
                        <button class="btn btn-primary w-100" type="submit">Guardar Reserva</button>
                    </form>
                </div>
            </section>

            <!-- Tabla de Catálogo -->
            <section class="col-lg-8">
                <div class="panel p-4">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <h2 class="h5 mb-0">Historial de Reservas</h2>
                        <input id="buscador" class="form-control form-control-sm w-auto" type="search" placeholder="Buscar reserva...">
                    </div>
                    <div class="table-responsive">
                        <table class="table table-hover align-middle mb-0" id="tablaReservas">
                            <thead>
                                <tr><th>ID</th><th>Inmueble</th><th>Arrendatario</th><th>Fechas</th><th>Total</th><th>Estado</th><th class="text-end">Acción</th></tr>
                            </thead>
                            <tbody>
                                <tr th:each="item : ${reservas}">
                                    <td th:text="${item.idReserva}"></td>
                                    <td th:text="${item.propiedad.titulo}"></td>
                                    <td th:text="${item.arrendatario.nombres + ' ' + item.arrendatario.apellidos}"></td>
                                    <td th:text="${item.fechaInicio + ' al ' + item.fechaFin}"></td>
                                    <td th:text="'$' + ${item.precioTotal}"></td>
                                    <td><span class="badge" th:classappend="${item.estado.name() == 'CONFIRMADA' ? 'bg-success' : (item.estado.name() == 'CANCELADA' ? 'bg-danger' : 'bg-warning text-dark')}" th:text="${item.estado}"></span></td>
                                    <td class="text-end">
                                        <form class="d-inline" th:if="${item.estado.name() != 'CANCELADA'}" th:action="@{/vista/reservas/{id}/cancelar(id=${item.idReserva})}" method="post">
                                            <button class="btn btn-outline-danger btn-sm" onclick="return confirm('¿Cancelar reserva?')">Cancelar</button>
                                        </form>
                                    </td>
                                </tr>
                                <tr th:if="${#lists.isEmpty(reservas)}"><td colspan="7" class="text-center text-muted py-4">No hay reservas registradas.</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </section>
        </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.getElementById('buscador').addEventListener('input', function () {
            const query = this.value.toLowerCase();
            document.querySelectorAll('#tablaReservas tbody tr').forEach(row => {
                row.style.display = row.textContent.toLowerCase().includes(query) ? '' : 'none';
            });
        });
    </script>
</body>
</html>
