<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apartamentos | Disponibilidad</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root { --navy: #1a252f; --teal: #0d9488; --bg: #f8fafc; }
        body { background: var(--bg); color: #334155; font-family: system-ui, -apple-system, sans-serif; }
        .navbar { background: var(--navy); }
        .panel { background: #fff; border: 1px solid #e2e8f0; border-radius: 8px; }
        .table thead th { background: var(--navy); color: #fff; }
        .btn-primary { background: var(--teal); border-color: var(--teal); }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark mb-4">
        <div class="container">
            <a class="navbar-brand fw-bold" th:href="@{/vista/clientes}">APARTAMENTOS</a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link text-white-50" th:href="@{/vista/clientes}">Clientes</a>
                <a class="nav-link text-white-50" th:href="@{/vista/propiedades}">Propiedades</a>
                <a class="nav-link active" th:href="@{/vista/disponibilidades}">Disponibilidad</a>
                <a class="nav-link text-white-50" th:href="@{/vista/reservas}">Reservas</a>
                <a class="nav-link text-white-50" th:href="@{/vista/pagos}">Pagos</a>
                <a class="nav-link text-white-50" th:href="@{/vista/reportes}">Reportes</a>
            </div>
        </div>
    </nav>

    <main class="container pb-5">
        <header class="d-flex justify-content-between align-items-center mb-4 border-bottom pb-3">
            <div>
                <p class="text-uppercase small mb-0 text-muted">Calendario y Precios</p>
                <h1 class="h3 mb-0">Disponibilidad y Bloqueos</h1>
            </div>
        </header>

        <div th:if="${mensaje}" class="alert alert-success alert-dismissible fade show"><span th:text="${mensaje}"></span><button type="button" class="btn-close" data-bs-dismiss="alert"></button></div>
        <div th:if="${error}" class="alert alert-danger alert-dismissible fade show"><span th:text="${error}"></span><button type="button" class="btn-close" data-bs-dismiss="alert"></button></div>

        <!-- Filtro de Selección de Propiedad -->
        <div class="panel p-3 mb-4">
            <form th:action="@{/vista/disponibilidades}" method="get" class="row g-3 align-items-center">
                <div class="col-auto"><label class="fw-bold">Seleccionar Propiedad:</label></div>
                <div class="col-md-6">
                    <select name="idPropiedad" class="form-select" onchange="this.form.submit()">
                        <option th:each="p : ${propiedades}" th:value="${p.idPropiedad}" th:selected="${p.idPropiedad == idPropiedadSeleccionada}" th:text="${p.titulo + ' (' + p.tipo + ')'}"></option>
                    </select>
                </div>
            </form>
        </div>

        <div class="row g-4">
            <!-- Formulario para agregar Bloqueo o Precio Especial -->
            <section class="col-lg-4">
                <div class="panel p-4">
                    <h2 class="h5 mb-3">Nuevo Período</h2>
                    <form th:action="@{/vista/disponibilidades/guardar}" th:object="${disponibilidad}" method="post">
                        <input type="hidden" name="propiedad.idPropiedad" th:value="${idPropiedadSeleccionada}">
                        <div class="mb-3"><label class="form-label">Fecha Inicio</label><input type="date" class="form-control" th:field="*{fechaInicio}" required></div>
                        <div class="mb-3"><label class="form-label">Fecha Fin</label><input type="date" class="form-control" th:field="*{fechaFin}" required></div>
                        <div class="mb-3">
                            <label class="form-label">Estado Disponibilidad</label>
                            <select class="form-select" th:field="*{disponible}">
                                <option value="true">Disponible (Aplica precio especial)</option>
                                <option value="false">Bloqueado (No disponible)</option>
                            </select>
                        </div>
                        <div class="mb-3"><label class="form-label">Precio Especial (Opcional)</label><input type="number" step="0.01" class="form-control" th:field="*{precioEspecial}"></div>
                        <button class="btn btn-primary w-100" type="submit" th:disabled="${idPropiedadSeleccionada == null}">Guardar Regla</button>
                    </form>
                </div>
            </section>

            <!-- Lista de Reglas de Disponibilidad -->
            <section class="col-lg-8">
                <div class="panel p-4">
                    <h2 class="h5 mb-3">Períodos Registrados</h2>
                    <div class="table-responsive">
                        <table class="table table-hover align-middle mb-0">
                            <thead>
                                <tr><th>ID</th><th>Inicio</th><th>Fin</th><th>Estatus</th><th>Precio Especial</th><th class="text-end">Acción</th></tr>
                            </thead>
                            <tbody>
                                <tr th:each="item : ${disponibilidades}">
                                    <td th:text="${item.idDisponibilidad}"></td>
                                    <td th:text="${item.fechaInicio}"></td>
                                    <td th:text="${item.fechaFin}"></td>
                                    <td><span class="badge" th:classappend="${item.disponible ? 'bg-success' : 'bg-danger'}" th:text="${item.disponible ? 'DISPONIBLE' : 'BLOQUEADO'}"></span></td>
                                    <td th:text="${item.precioEspecial != null ? '$' + item.precioEspecial : '-'}"></td>
                                    <td class="text-end">
                                        <form th:action="@{/vista/disponibilidades/{id}/eliminar(id=${item.idDisponibilidad})}" method="post">
                                            <input type="hidden" name="idPropiedad" th:value="${idPropiedadSeleccionada}">
                                            <button class="btn btn-outline-danger btn-sm" onclick="return confirm('¿Eliminar período?')">Eliminar</button>
                                        </form>
                                    </td>
                                </tr>
                                <tr th:if="${#lists.isEmpty(disponibilidades)}"><td colspan="6" class="text-center text-muted py-4">No hay reglas registradas para esta propiedad.</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </section>
        </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
