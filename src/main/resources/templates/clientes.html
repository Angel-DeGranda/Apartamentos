<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apartamentos | Clientes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root { --navy: #1a252f; --teal: #0d9488; --bg: #f8fafc; }
        body { background: var(--bg); color: #334155; font-family: system-ui, -apple-system, sans-serif; }
        .navbar { background: var(--navy); }
        .panel { background: #fff; border: 1px solid #e2e8f0; border-radius: 8px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); }
        .table thead th { background: var(--navy); color: #fff; }
        .btn-primary { background: var(--teal); border-color: var(--teal); }
        .btn-primary:hover { background: #0f766e; }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark mb-4">
        <div class="container">
            <a class="navbar-brand fw-bold" th:href="@{/vista/clientes}">APARTAMENTOS</a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link active" th:href="@{/vista/clientes}">Clientes</a>
                <a class="nav-link text-white-50" th:href="@{/vista/propiedades}">Propiedades</a>
                <a class="nav-link text-white-50" th:href="@{/vista/disponibilidades}">Disponibilidad</a>
                <a class="nav-link text-white-50" th:href="@{/vista/reservas}">Reservas</a>
                <a class="nav-link text-white-50" th:href="@{/vista/pagos}">Pagos</a>
                <a class="nav-link text-white-50" th:href="@{/vista/reportes}">Reportes</a>
            </div>
        </div>
    </nav>

    <main class="container pb-5">
        <header class="d-flex justify-content-between align-items-center mb-4 border-bottom pb-3">
            <div>
                <p class="text-uppercase small mb-0 text-muted">Gestión de Usuarios</p>
                <h1 class="h3 mb-0">Clientes</h1>
            </div>
            <span class="badge bg-secondary fs-6" th:text="${#lists.size(clientes)} + ' registrados'">0 registrados</span>
        </header>

        <div th:if="${mensaje}" class="alert alert-success alert-dismissible fade show" role="alert">
            <span th:text="${mensaje}"></span><button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
            <span th:text="${error}"></span><button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <div class="row g-4">
            <!-- Formulario de Registro -->
            <section class="col-lg-4">
                <div class="panel p-4">
                    <h2 class="h5 mb-3">Registrar Cliente</h2>
                    <form th:action="@{/vista/clientes/guardar}" th:object="${cliente}" method="post">
                        <div class="mb-3">
                            <label class="form-label">Tipo de Cliente</label>
                            <select class="form-select" th:field="*{tipo}" required>
                                <option th:each="t : ${tiposCliente}" th:value="${t}" th:text="${t}"></option>
                            </select>
                        </div>
                        <div class="mb-3"><label class="form-label">Nombres</label><input class="form-control" th:field="*{nombres}" required></div>
                        <div class="mb-3"><label class="form-label">Apellidos</label><input class="form-control" th:field="*{apellidos}" required></div>
                        <div class="mb-3"><label class="form-label">Correo Electrónico</label><input type="email" class="form-control" th:field="*{email}" required></div>
                        <div class="mb-3"><label class="form-label">Teléfono</label><input class="form-control" th:field="*{telefono}"></div>
                        <div class="mb-3"><label class="form-label">INE / Identificación</label><input class="form-control" th:field="*{ine}"></div>
                        <div class="mb-3"><label class="form-label">Dirección</label><input class="form-control" th:field="*{direccion}"></div>
                        <div class="mb-3"><label class="form-label">Contraseña</label><input type="password" class="form-control" th:field="*{password}" required></div>
                        <button class="btn btn-primary w-100" type="submit">Guardar Cliente</button>
                    </form>
                </div>
            </section>

            <!-- Tabla de Catálogo -->
            <section class="col-lg-8">
                <div class="panel p-4">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <h2 class="h5 mb-0">Catálogo de Clientes</h2>
                        <input id="buscador" class="form-control form-control-sm w-auto" type="search" placeholder="Buscar cliente...">
                    </div>
                    <div class="table-responsive">
                        <table class="table table-hover align-middle mb-0" id="tablaClientes">
                            <thead>
                                <tr><th>ID</th><th>Nombre</th><th>Tipo</th><th>Email</th><th>Teléfono</th><th class="text-end">Acciones</th></tr>
                            </thead>
                            <tbody>
                                <tr th:each="item : ${clientes}">
                                    <td th:text="${item.id}"></td>
                                    <td th:text="${item.nombres + ' ' + item.apellidos}"></td>
                                    <td><span class="badge" th:classappend="${item.tipo.name() == 'PROPIETARIO' ? 'bg-primary' : 'bg-info'}" th:text="${item.tipo}"></span></td>
                                    <td th:text="${item.email}"></td>
                                    <td th:text="${item.telefono}"></td>
                                    <td class="text-end text-nowrap">
                                        <button class="btn btn-outline-primary btn-sm" data-bs-toggle="modal" th:data-bs-target="'#editar-' + ${item.id}">Editar</button>
                                        <form class="d-inline" th:action="@{/vista/clientes/{id}/eliminar(id=${item.id})}" method="post">
                                            <button class="btn btn-outline-danger btn-sm" onclick="return confirm('¿Eliminar cliente?')">Eliminar</button>
                                        </form>
                                    </td>

                                    <!-- Modal de Edición -->
                                    <div class="modal fade" th:id="'editar-' + ${item.id}" tabindex="-1">
                                        <div class="modal-dialog">
                                            <div class="modal-content">
                                                <form th:action="@{/vista/clientes/{id}/actualizar(id=${item.id})}" method="post">
                                                    <div class="modal-header"><h5 class="modal-title">Editar Cliente</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
                                                    <div class="modal-body">
                                                        <div class="mb-3"><label class="form-label">Tipo</label>
                                                            <select class="form-select" name="tipo">
                                                                <option th:each="t : ${tiposCliente}" th:value="${t}" th:selected="${t == item.tipo}" th:text="${t}"></option>
                                                            </select>
                                                        </div>
                                                        <div class="mb-3"><label class="form-label">Nombres</label><input class="form-control" name="nombres" th:value="${item.nombres}" required></div>
                                                        <div class="mb-3"><label class="form-label">Apellidos</label><input class="form-control" name="apellidos" th:value="${item.apellidos}" required></div>
                                                        <div class="mb-3"><label class="form-label">Email</label><input type="email" class="form-control" name="email" th:value="${item.email}" required></div>
                                                        <div class="mb-3"><label class="form-label">Teléfono</label><input class="form-control" name="telefono" th:value="${item.telefono}"></div>
                                                        <div class="mb-3"><label class="form-label">Dirección</label><input class="form-control" name="direccion" th:value="${item.direccion}"></div>
                                                        <input type="hidden" name="password" th:value="${item.password}">
                                                    </div>
                                                    <div class="modal-footer">
                                                        <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancelar</button>
                                                        <button class="btn btn-primary" type="submit">Guardar Cambios</button>
                                                    </div>
                                                </form>
                                            </div>
                                        </div>
                                    </div>
                                </tr>
                                <tr th:if="${#lists.isEmpty(clientes)}"><td colspan="6" class="text-center text-muted py-4">No hay clientes registrados.</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </section>
        </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.getElementById('buscador').addEventListener('input', function () {
            const query = this.value.toLowerCase();
            document.querySelectorAll('#tablaClientes tbody tr').forEach(row => {
                row.style.display = row.textContent.toLowerCase().includes(query) ? '' : 'none';
            });
        });
    </script>
</body>
</html>
