<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apartamentos | Pagos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root { --navy: #1a252f; --teal: #0d9488; --bg: #f8fafc; }
        body { background: var(--bg); color: #334155; font-family: system-ui, -apple-system, sans-serif; }
        .navbar { background: var(--navy); }
        .panel { background: #fff; border: 1px solid #e2e8f0; border-radius: 8px; }
        .table thead th { background: var(--navy); color: #fff; }
        .btn-primary { background: var(--teal); border-color: var(--teal); }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark mb-4">
        <div class="container">
            <a class="navbar-brand fw-bold" th:href="@{/vista/clientes}">APARTAMENTOS</a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link text-white-50" th:href="@{/vista/clientes}">Clientes</a>
                <a class="nav-link text-white-50" th:href="@{/vista/propiedades}">Propiedades</a>
                <a class="nav-link text-white-50" th:href="@{/vista/disponibilidades}">Disponibilidad</a>
                <a class="nav-link text-white-50" th:href="@{/vista/reservas}">Reservas</a>
                <a class="nav-link active" th:href="@{/vista/pagos}">Pagos</a>
                <a class="nav-link text-white-50" th:href="@{/vista/reportes}">Reportes</a>
            </div>
        </div>
    </nav>

    <main class="container pb-5">
        <header class="d-flex justify-content-between align-items-center mb-4 border-bottom pb-3">
            <div>
                <p class="text-uppercase small mb-0 text-muted">Gestión Financiera</p>
                <h1 class="h3 mb-0">Cobros y Pagos</h1>
            </div>
        </header>

        <div th:if="${mensaje}" class="alert alert-success alert-dismissible fade show"><span th:text="${mensaje}"></span><button type="button" class="btn-close" data-bs-dismiss="alert"></button></div>
        <div th:if="${error}" class="alert alert-danger alert-dismissible fade show"><span th:text="${error}"></span><button type="button" class="btn-close" data-bs-dismiss="alert"></button></div>

        <div class="row g-4">
            <!-- Formulario de Registro de Pago -->
            <section class="col-lg-4">
                <div class="panel p-4">
                    <h2 class="h5 mb-3">Registrar Pago</h2>
                    <form th:action="@{/vista/pagos/guardar}" th:object="${pago}" method="post">
                        <div class="mb-3">
                            <label class="form-label">Reserva Vinculada</label>
                            <select class="form-select" th:field="*{reserva.idReserva}" required>
                                <option value="" disabled selected>Seleccione reserva...</option>
                                <option th:each="r : ${reservas}" th:value="${r.idReserva}" th:text="'Reserva #' + ${r.idReserva} + ' - ' + ${r.arrendatario.nombres} + ' ($' + ${r.precioTotal} + ')'"></option>
                            </select>
                        </div>
                        <div class="mb-3"><label class="form-label">Monto ($)</label><input type="number" step="0.01" class="form-control" th:field="*{monto}" required></div>
                        <div class="mb-3"><label class="form-label">Fecha Vencimiento</label><input type="date" class="form-control" th:field="*{fechaVencimiento}" required></div>
                        <div class="mb-3"><label class="form-label">Fecha de Pago</label><input type="date" class="form-control" th:field="*{fechaPago}"></div>
                        <div class="mb-3">
                            <label class="form-label">Método de Pago</label>
                            <select class="form-select" th:field="*{metodoPago}">
                                <option th:each="m : ${metodosPago}" th:value="${m}" th:text="${m}"></option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Estado de Pago</label>
                            <select class="form-select" th:field="*{estado}" required>
                                <option th:each="e : ${estadosPago}" th:value="${e}" th:text="${e}"></option>
                            </select>
                        </div>
                        <button class="btn btn-primary w-100" type="submit">Guardar Pago</button>
                    </form>
                </div>
            </section>

            <!-- Tabla de Transacciones -->
            <section class="col-lg-8">
                <div class="panel p-4">
                    <h2 class="h5 mb-3">Historial de Pagos</h2>
                    <div class="table-responsive">
                        <table class="table table-hover align-middle mb-0">
                            <thead>
                                <tr><th>ID</th><th>Reserva</th><th>Monto</th><th>Vencimiento</th><th>Fecha Pago</th><th>Estado</th><th class="text-end">Acciones</th></tr>
                            </thead>
                            <tbody>
                                <tr th:each="item : ${pagos}">
                                    <td th:text="${item.idPago}"></td>
                                    <td th:text="'Reserva #' + ${item.reserva.idReserva}"></td>
                                    <td th:text="'$' + ${item.monto}"></td>
                                    <td th:text="${item.fechaVencimiento}"></td>
                                    <td th:text="${item.fechaPago != null ? item.fechaPago : '-'}"></td>
                                    <td><span class="badge" th:classappend="${item.estado.name() == 'PAGADO' ? 'bg-success' : (item.estado.name() == 'ATRASADO' ? 'bg-danger' : 'bg-warning text-dark')}" th:text="${item.estado}"></span></td>
                                    <td class="text-end">
                                        <form class="d-inline" th:action="@{/vista/pagos/{id}/actualizar-estado(id=${item.idPago})}" method="post">
                                            <select name="nuevoEstado" class="form-select form-select-sm d-inline-block w-auto me-1" onchange="this.form.submit()">
                                                <option th:each="e : ${estadosPago}" th:value="${e}" th:selected="${e == item.estado}" th:text="${e}"></option>
                                            </select>
                                        </form>
                                    </td>
                                </tr>
                                <tr th:if="${#lists.isEmpty(pagos)}"><td colspan="7" class="text-center text-muted py-4">No hay pagos registrados.</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </section>
        </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
