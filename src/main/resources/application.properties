spring.application.name=apartamentos

# ===================================================================
# CONFIGURACIÓN DE BASE DE DATOS (MYSQL)
# Modifica la URL, usuario y contraseña según tu configuración local:
# ===================================================================
spring.datasource.url=${TU_URL_DE_LA_BASE_DE_DATOS_AQUI:jdbc:mysql://localhost:3306/apartamentos_blue}
spring.datasource.username=${TU_USUARIO_AQUI:root}
spring.datasource.password=${TU_CONTRASENIA_AQUI:root}

# ===================================================================
# CONFIGURACIÓN DE JPA / HIBERNATE
# ===================================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# ===================================================================
# PUERTO DEL SERVIDOR
# ===================================================================
server.port=${TU_PUERTO_DE_SERVIDOR_AQUI:8080}
